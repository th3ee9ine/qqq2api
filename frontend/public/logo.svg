<svg width="2400" height="2400" viewBox="0 0 2400 2400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">QQQ2API</title>
  <desc id="desc">QQQ2API LLM API aggregation logo</desc>
  <defs>
    <!-- Glow for Q's - matching PDF alpha blending -->
    <filter id="qGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="blur1"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.3"/>
      <feComposite in2="blur1" operator="in" result="glow1"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="13" result="blur2"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.2"/>
      <feComposite in2="blur2" operator="in" result="glow2"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur3"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.3"/>
      <feComposite in2="blur3" operator="in" result="glow3"/>

      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow3"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Convergence glow - matching PDF layering -->
    <filter id="centerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="33" result="blur1"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.2"/>
      <feComposite in2="blur1" operator="in" result="glow1"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="27" result="blur2"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.3"/>
      <feComposite in2="blur2" operator="in" result="glow2"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="blur3"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.4"/>
      <feComposite in2="blur3" operator="in" result="glow3"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="13" result="blur4"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.6"/>
      <feComposite in2="blur4" operator="in" result="glow4"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur5"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.8"/>
      <feComposite in2="blur5" operator="in" result="glow5"/>

      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow3"/>
        <feMergeNode in="glow4"/>
        <feMergeNode in="glow5"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Line glow - matching PDF -->
    <filter id="lineGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur1"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.3"/>
      <feComposite in2="blur1" operator="in" result="glow1"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur2"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.6"/>
      <feComposite in2="blur2" operator="in" result="glow2"/>

      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="glow2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text glow -->
    <filter id="textGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="2400" height="2400" fill="#0A0A0F"/>

  <!-- Connection lines -->
  <g filter="url(#lineGlow)">
    <line x1="1200" y1="920" x2="1200" y2="1200" stroke="#FFA500" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="956" y1="1340" x2="1200" y2="1200" stroke="#FFA500" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="1444" y1="1340" x2="1200" y2="1200" stroke="#FFA500" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Top Q -->
  <g filter="url(#qGlow)">
    <circle cx="1200" cy="780" r="200" fill="none" stroke="#FFD700" stroke-width="28"/>
    <line x1="1200" y1="880" x2="1200" y2="980" stroke="#FFD700" stroke-width="28" stroke-linecap="round"/>
  </g>

  <!-- Bottom-left Q -->
  <g filter="url(#qGlow)">
    <circle cx="836" cy="1410" r="200" fill="none" stroke="#FFD700" stroke-width="28"/>
    <line x1="923" y1="1360" x2="1010" y2="1310" stroke="#FFD700" stroke-width="28" stroke-linecap="round"/>
  </g>

  <!-- Bottom-right Q -->
  <g filter="url(#qGlow)">
    <circle cx="1564" cy="1410" r="200" fill="none" stroke="#FFD700" stroke-width="28"/>
    <line x1="1477" y1="1360" x2="1390" y2="1310" stroke="#FFD700" stroke-width="28" stroke-linecap="round"/>
  </g>

  <!-- Central convergence -->
  <g filter="url(#centerGlow)">
    <circle cx="1200" cy="1200" r="99" fill="#FFD700" opacity="0.2"/>
    <circle cx="1200" cy="1200" r="81" fill="#FFD700" opacity="0.3"/>
    <circle cx="1200" cy="1200" r="60" fill="#FFD700" opacity="0.4"/>
    <circle cx="1200" cy="1200" r="39" fill="#FFD700" opacity="0.6"/>
    <circle cx="1200" cy="1200" r="24" fill="#FFD700" opacity="0.8"/>
    <circle cx="1200" cy="1200" r="18" fill="#FFFFFF"/>
  </g>

  <!-- Text -->
  <text x="1200" y="1820" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" text-anchor="middle" filter="url(#textGlow)">QQQ2API</text>
  <text x="1200" y="1920" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#FFA500" text-anchor="middle" letter-spacing="4">LLM API AGGREGATION</text>
</svg>
